[build]
  # Migrate Neon first so the schema is ready before the new functions go live.
  command = "pnpm db:migrate && pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

[functions]
  # On Netlify CV text is extracted inline (each invocation is already isolated). The isolated child-process mode
  # (CV_EXTRACTION=isolated) needs these files, so ship them to keep that switch working.
  included_files = ["scripts/extract-cv-text.mjs", "src/lib/cv/extract-core.mjs"]
