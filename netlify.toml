[build]
  # Deploy previews and branch deploys only build. Intentional: they must never migrate (or, ideally, even reach)
  # the production database — scope DATABASE_URL and the Inngest keys to the Production context in Netlify.
  command = "pnpm build"
  publish = ".next"

[context.production]
  # Migrate Neon first so the schema is ready before the new functions go live. Fails the deploy if
  # DATABASE_URL is missing, instead of shipping an app with no schema.
  command = "pnpm db:migrate && pnpm build"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"
